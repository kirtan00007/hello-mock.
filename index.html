<!doctype html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Budget System</h1>

    <h2>Add Budget</h2>

    <form id="budgetForm">
        <label>Budget Amount:</label>
        <input type="number" id="budgetInput">
        <button type="submit">Budget final</button>
    </form>

    <h2>Add Expense</h2>

    <form id="expenseForm">
        <label>Expense Title:</label>
        <input type="text" id="expenseTitle">

        <label>Amount:</label>
        <input type="number" id="expenseAmount">

        <button type="submit">Expense</button>
    </form>

    <button id="resetBtn">Reset</button>

    <h2>Summary</h2>

    <p>Total Budget: <span id="totalBudget">0</span></p>
    <p>Total Expenses: <span id="totalExpenses">0</span></p>
    <p>Budget Left: <span id="budgetLeft">0</span></p>

    <h2>Expense History</h2>

    <table id="expenseTable">
        <tr>
            <th>Expense Name</th>
            <th>Amount</th>
            <th>Action</th>
        </tr>
    </table>

    <script src="script.js"></script>

</body>

</html>
